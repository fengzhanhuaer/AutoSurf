[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosurf"
version = "0.1.0"
description = "A small, durable web automation platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
autosurf = "autosurf.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/autosurf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

