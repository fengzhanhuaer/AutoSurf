[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosurf"
version = "0.1.0"
description = "A small, durable web automation platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.19.1",
  "ddddocr==1.6.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "packaging==25.0",
  "pydantic-settings==2.15.0",
  "playwright==1.61.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
]

[project.scripts]
autosurf = "autosurf.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/autosurf"]
artifacts = ["src/autosurf/migrations/versions/*.py", "src/autosurf/web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
