[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosurf"
version = "0.1.0"
description = "A small, durable web automation platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<51",
  "ddddocr>=1.6.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "packaging>=24,<26",
  "pydantic-settings>=2.7,<3",
  "playwright==1.61.0",
  "selkies @ git+https://github.com/selkies-project/selkies.git@3515d635968592dbef8fe83713030ca84bdd5f2b ; sys_platform == 'linux'",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
autosurf = "autosurf.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/autosurf"]
artifacts = ["src/autosurf/migrations/versions/*.py", "src/autosurf/web/*"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
