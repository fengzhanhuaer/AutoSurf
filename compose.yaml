services:
  autosurf:
    image: ghcr.io/fengzhanhuaer/autosurf:latest
    # Keep the browser shell stable; update the mounted program with autosurf-upgrade.
    pull_policy: missing
    container_name: autosurf
    ipc: host
    ports:
      - "0.0.0.0:18980:8080"
    volumes:
      - ./data:/app/data
      - ./autosurf_program:/app/program
    tmpfs:
      # First-run dependency installation and Chromium both need writable temp space.
      - /tmp:size=512m,mode=1777
    environment:
      HOME: /tmp/home
      TZ: Asia/Taipei
      AUTOSURF_DATA_DIR: /app/data
      AUTOSURF_SECRET_KEY: "CHANGE-ME-random-encryption-key-at-least-32-characters"
      AUTOSURF_USERNAME: "admin"
      AUTOSURF_PASSWORD: "CHANGE-ME-strong-management-password"
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 30s
      timeout: 3s
      # A new program volume installs its Python environment before the API starts.
      start_period: 20m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
