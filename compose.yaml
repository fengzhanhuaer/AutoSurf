services:
  autosurf:
    image: ghcr.io/fengzhanhuaer/autosurf:latest
    # Keep the base shell and Google Chrome stable; Web upgrades update the application environment.
    pull_policy: missing
    container_name: autosurf
    ipc: host
    ports:
      - "0.0.0.0:18980:8080"
    volumes:
      # Keep all persistent application state under one host directory.
      - ./app:/app
      # Writable, host-visible temp space while the container root remains read-only.
      - ./tmp:/tmp
    environment:
      HOME: /tmp/home
      TZ: Asia/Taipei
      AUTOSURF_DATA_DIR: /app/data
      AUTOSURF_PROGRAM_DIR: /app/program
      AUTOSURF_UPGRADE_SCRIPT: /usr/local/bin/autosurf-upgrade
      PLAYWRIGHT_BROWSERS_PATH: /app/browser
      AUTOSURF_SECRET_KEY: "CHANGE-ME-random-encryption-key-at-least-32-characters"
      AUTOSURF_USERNAME: "admin"
      AUTOSURF_PASSWORD: "CHANGE-ME-strong-management-password"
    # Chrome's sandboxed internal and extension pages require container privileges.
    privileged: true
    # Chrome creates many renderer threads when several sites open at once.
    pids_limit: 4096
    read_only: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 30s
      timeout: 3s
      # A new program volume installs its Python environment before the API starts.
      start_period: 20m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
